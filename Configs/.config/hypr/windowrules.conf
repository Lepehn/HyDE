# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hypr.land/Configuring/Window-Rules/

#? ------- WINDOWRULES_HYPRLAND_V_0_53 COMPATIBLE ----------------
#   This Config is compatible with windowrules changes in Hyprland v0.53+
#   Any future breaking changes disables this block and notifies the user to update.
#   User template files will be provided in $XDG_DATA_HOME/hyde/templates/hypr/windowrules.conf for manual update.

# hyprlang if WINDOWRULES_HYPRLAND_V_0_53

# ==============================================================================
# --- USER SETTINGS (Tweak these) ---------------------------------------------
# ==============================================================================
$NON_TRANSLUCENT  = 1.0
$TRANSLUCENT      = 0.8
$CENTERED         = off

# --- Core Application Groups ---
$BROWSERS      = chromium|firefox|brave|zen-browser
$DESKTOP_APPS  = discord|steam|obs-studio
$DEV_TOOLS     = code-oss|code|vscodium|jetbrains-.*
$FILE_MANAGERS = dolphin|nemo|nautilus|thunar|org.kde.*|org.gnome.*
$MEDIA_PLAYERS = mpv|vlc|spotify|cava
$SYSTEM_UTILS  = kvantummanager|qt5ct|qt6ct|nwg-displays|nwg-look|udiskie|pavucontrol|blueman-manager|nm-connection-editor
$TERMINALS     = kitty|alacritty

# --- Size Rule Class Allocations ---
$EXTRA_LARGE_FLOAT_APPS  = ^($BROWSERS)$
$LARGE_FLOAT_APPS        = ^($DESKTOP_APPS|$DEV_TOOLS)$
$MEDIUM_FLOAT_APPS       = ^($TERMINALS|$MEDIA_PLAYERS|$FILE_MANAGERS)$
$SMALL_FLOAT_APPS        = ^($SYSTEM_UTILS)$

# --- Shared Title Patterns ---
$POPUP_TITLES = ^(Open File|Save As|Select a File|Choose Files|Confirm|Properties|Preferences)$

# Idle and Supress
windowrule = idle_inhibit fullscreen, match:class .*
windowrule = suppress_event maximize, match:class .*

# Picture-In-Picture
windowrule {
    name = hyde_picture_in_picture
    match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
    tag = +picture-in-picture
    tag = +hyde_picture_in_picture
    float = true
    keep_aspect_ratio = true
    move = (monitor_w*0.73) (monitor_h*0.72)
    size = (monitor_w*0.25) (monitor_h*0.25)
    pin = true
}

# Fallback
windowrule = float on, match:class .*
windowrule = max_size 1920 1080, match:class .*
windowrule = min_size 1 1, match:class .*
windowrule = center $CENTERED , match:class .*

# Dialogs & Popups
windowrule = float on, match:title $POPUP_TITLES
windowrule = center $CENTERED, match:title $POPUP_TITLES

# Extra Large Floating Windows (1920x1080)
windowrule = float on, match:class $EXTRA_LARGE_FLOAT_APPS
windowrule = max_size 1920 1080, match:class $EXTRA_LARGE_FLOAT_APPS
windowrule = min_size 1 1, match:class $EXTRA_LARGE_FLOAT_APPS
windowrule = center $CENTERED , match:class $EXTRA_LARGE_FLOAT_APPS

# Large Floating Windows (1280x720)
windowrule = float on, match:class $LARGE_FLOAT_APPS
windowrule = max_size 1280 720, match:class $LARGE_FLOAT_APPS
windowrule = min_size 1 1, match:class $LARGE_FLOAT_APPS
windowrule = center on, match:class $LARGE_FLOAT_APPS

# Medium Floating Windows (960x540) - always set
windowrule = float on, match:class $MEDIUM_FLOAT_APPS
windowrule = size 960 540, match:class $MEDIUM_FLOAT_APPS
windowrule = min_size 1 1, match:class $MEDIUM_FLOAT_APPS
windowrule = center $CENTERED , match:class $MEDIUM_FLOAT_APPS

# Small Floating Windows (640x360)
windowrule = float on, match:class $SMALL_FLOAT_APPS
windowrule = max_size 640 360, match:class $SMALL_FLOAT_APPS
windowrule = min_size 1 1, match:class $SMALL_FLOAT_APPS
windowrule = center $CENTERED , match:class $SMALL_FLOAT_APPS

# Animation Rules
windowrule {
  name = pop-in
  match:class = .*
  animation = popin
}

# Visual Style Rules
windowrule = opacity 1.0 1.0 1.0, match:class .*

$OPAQUE_APPS      = ^($BROWSERS|$DESKTOP_APPS|$DEV_TOOLS)$
$TRANSLUCENT_APPS = ^($FILE_MANAGERS|$SYSTEM_UTILS|$TERMINALS)$

windowrule = opacity $NON_TRANSLUCENT override $NON_TRANSLUCENT override $NON_TRANSLUCENT override, match:class $OPAQUE_APPS
windowrule = opacity $TRANSLUCENT $TRANSLUCENT $TRANSLUCENT, match:class $TRANSLUCENT_APPS

# Layer Rules
layerrule = blur true,match:namespace rofi
layerrule = ignore_alpha 0,match:namespace rofi
layerrule = blur true,match:namespace notifications
layerrule = ignore_alpha 0,match:namespace notifications
layerrule = blur true,match:namespace swaync-notification-window
layerrule = ignore_alpha 0,match:namespace swaync-notification-window
layerrule = blur true,match:namespace swaync-control-center
layerrule = ignore_alpha 0,match:namespace swaync-control-center
layerrule = blur true,match:namespace logout_dialog

# hyprlang endif
